name: Révizz – compiler l'APK Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'appli web et la copier dans Android
        env:
          # Adresse du site Révizz (Netlify), préremplie dans l'APK si la variable du dépôt existe.
          VITE_REVIZZ_SERVEUR: ${{ vars.REVIZZ_SERVEUR || 'https://revizz.netlify.app' }}
        run: npm run android:sync

      - name: Numéro de version
        # Les APK 1.0.x venaient de l'ancien dépôt (numéros 1 à 7). On repart en 1.1.x avec un numéro
        # interne plus grand, sinon Android refuserait d'installer la mise à jour.
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Revizz.apk"

      - name: Mettre l'APK en téléchargement (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Revizz-apk
          path: Revizz.apk

      - name: Publier l'APK (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Révizz ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            Télécharge **Revizz.apk** ci-dessous depuis le téléphone Android, puis ouvre-le pour l'installer.
            (Autorise « Installer des applis inconnues » pour ton navigateur si Android le demande.)
          files: Revizz.apk
          make_latest: true
